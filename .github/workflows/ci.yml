name: Ralypto CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Frontend Pipeline: Arkesh
  # Validates dependencies, lints, runs TypeScript compiler, tests, and builds
  # ============================================================================
  frontend:
    name: Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run i18n Completeness Check
        run: npm run i18n:check

      - name: Run Unit Tests
        run: npm run test

      - name: Run Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Python for API E2E tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend API dependencies
        working-directory: .
        run: python -m pip install -r backend/requirements.txt

      - name: Run E2E & Accessibility Tests
        run: npm run test:e2e

